server.port=8080

spring.application.name=api-gateway
spring.config.import=optional:configserver:http://localhost:8888

# --- Spring Cloud Gateway CORS Configuration ---
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[0]=${cors.allowed-origins:${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[5]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# --- Spring Cloud Gateway Default Filters ---
spring.cloud.gateway.default-filters[0].name=SetResponseHeader
spring.cloud.gateway.default-filters[0].args.name=X-Content-Type-Options
spring.cloud.gateway.default-filters[0].args.value=nosniff
spring.cloud.gateway.default-filters[1].name=SetResponseHeader
spring.cloud.gateway.default-filters[1].args.name=X-Frame-Options
spring.cloud.gateway.default-filters[1].args.value=DENY
spring.cloud.gateway.default-filters[2].name=SetResponseHeader
spring.cloud.gateway.default-filters[2].args.name=Referrer-Policy
spring.cloud.gateway.default-filters[2].args.value=strict-origin-when-cross-origin

# --- Discovery Locator ---
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# --- Spring Cloud Gateway Routes ---
spring.cloud.gateway.routes[0].id=auth-service-route
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=profile-service-route
spring.cloud.gateway.routes[1].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/profiles/**

spring.cloud.gateway.routes[2].id=product-service-route
spring.cloud.gateway.routes[2].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/products/**, /api/v1/merchant/products/**, /api/v1/admin/products/**

spring.cloud.gateway.routes[3].id=recommendation-service-route
spring.cloud.gateway.routes[3].uri=lb://RECOMMENDATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/recommendations/**

spring.cloud.gateway.routes[4].id=inventory-service-route
spring.cloud.gateway.routes[4].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/inventory/**

spring.cloud.gateway.routes[5].id=cart-service-route
spring.cloud.gateway.routes[5].uri=lb://CART-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/cart/**

spring.cloud.gateway.routes[6].id=order-service-route
spring.cloud.gateway.routes[6].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/orders/**, /api/v1/merchant/orders/**, /api/v1/admin/orders/**, /api/v1/returns/**, /api/v1/admin/returns/**

spring.cloud.gateway.routes[7].id=wallet-service-route
spring.cloud.gateway.routes[7].uri=lb://WALLET-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/wallet/**

spring.cloud.gateway.routes[8].id=payment-service-route
spring.cloud.gateway.routes[8].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/payments/**, /api/v1/refunds/**

spring.cloud.gateway.routes[9].id=delivery-service-route
spring.cloud.gateway.routes[9].uri=lb://DELIVERY-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/deliveries/**, /api/v1/admin/deliveries/**, /api/v1/agent/deliveries/**

spring.cloud.gateway.routes[10].id=notification-service-route
spring.cloud.gateway.routes[10].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.routes[11].id=review-service-route
spring.cloud.gateway.routes[11].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/v1/reviews/**, /api/v1/admin/reviews/**

# --- Eureka Client Configuration ---
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# --- JWT Configuration ---
jwt.secret=${JWT_SECRET}

# --- Custom Gateway Rate Limiter Configuration ---
gateway.rate-limiter.enabled=true
gateway.rate-limiter.replenish-rate=10
gateway.rate-limiter.burst-capacity=20

# --- Actuator Management Configuration ---
management.endpoints.web.exposure.include=health,info
